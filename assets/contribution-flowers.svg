<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="420" viewBox="0 0 1600 420" role="img" aria-labelledby="title desc">
<title id="title">Flores holográficas cyber-botánicas</title>
<desc id="desc">Ilustración panorámica de una flor holográfica luminosa con pétalos transparentes cian, violeta y magenta, raíces de datos y líneas de plano técnico sobre fondo negro.</desc>
